map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server { listen 80; server_name api.support.temmuzonline.com; location / { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; } }
server { listen 80; server_name support.temmuzonline.com localhost; location = /widget.js { proxy_pass http://widget/widget.js; add_header Cache-Control "public, max-age=300"; } location /admin/ { proxy_pass http://admin:3000/; proxy_set_header Host $host; } location / { proxy_pass http://admin:3000; proxy_set_header Host $host; } }
